# Railway service config for the Next.js app.
# In the Railway dashboard also set:
# - Variables: DATABASE_URL=${{Postgres.DATABASE_URL}}, AUTH_SECRET, optional Maps keys
# - Generate a public domain under Settings → Networking
#
# Migrations run in the start command (not pre-deploy) so Prisma is available
# after the Next standalone build and private networking is up.

[build]
builder = "RAILPACK"

[deploy]
startCommand = "npx prisma migrate deploy && npm run start"
# Clear any UI Pre-deploy Command if migrate fails there with "prisma not found"
