# Railway service config for the Next.js app.
# Variables on this service:
# - DATABASE_URL = reference to Postgres DATABASE_URL (not 127.0.0.1)
# - AUTH_SECRET = long random string
# Networking → Generate Domain → target port must match the PORT variable (use 3000)

[build]
builder = "RAILPACK"

[deploy]
startCommand = "sh -c 'npx prisma migrate deploy && HOSTNAME=0.0.0.0 PORT=${PORT:-3000} node .next/standalone/server.js'"
