services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ttgordon
      POSTGRES_PASSWORD: ttgordon
      POSTGRES_DB: ttgordon
    volumes:
      - ttgordon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttgordon -d ttgordon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ttgordon_pgdata:
